name: iOS unsigned simulator build

# Manual only. Nothing is built on push: this workflow produces an unsigned simulator
# app for inspection, never an installable, signed or App Store build.
on:
  workflow_dispatch:

  permissions:
    contents: read

    jobs:
      simulator:
          runs-on: macos-latest
              timeout-minutes: 30
                  steps:
                        - uses: actions/checkout@v4

                              - name: Xcode environment
                                      run: |
                                                mkdir -p build-logs
                                                          xcodebuild -version | tee build-logs/xcode-version.log
                                                                    xcrun --sdk iphonesimulator --show-sdk-version | tee -a build-logs/xcode-version.log
                                                                          - name: Static checks (sources, plists, project file, workflows)
                                                                                  shell: bash
                                                                                          run: |
                                                                                                    set -o pipefail
                                                                                                              python3 native/ios/scripts/verify.py 2>&1 | tee build-logs/verify.log
                                                                                                              
                                                                                                                    - name: Build unsigned generic iOS Simulator app
                                                                                                                            shell: bash
                                                                                                                                    run: |
                                                                                                                                              set -o pipefail
                                                                                                                                                        xcodebuild -project native/ios/OrunHomework.xcodeproj -scheme OrunHomework \
                                                                                                                                                                    -configuration Debug -sdk iphonesimulator \
                                                                                                                                                                                -destination 'generic/platform=iOS Simulator' \
                                                                                                                                                                                            -derivedDataPath native/ios/build/DerivedData \
                                                                                                                                                                                                        CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build-logs/xcodebuild.log
                                                                                                                                                                                                              - name: Package simulator app
                                                                                                                                                                                                                      run: |
                                                                                                                                                                                                                                ditto -c -k --sequesterRsrc --keepParent \
                                                                                                                                                                                                                                            native/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/OrunHomework.app \
                                                                                                                                                                                                                                                        OrunHomework-simulator.zip
                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                              - name: Upload unsigned simulator app
                                                                                                                                                                                                                                                                      uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                              with:
                                                                                                                                                                                                                                                                                        name: OrunHomework-unsigned-simulator
                                                                                                                                                                                                                                                                                                  path: OrunHomework-simulator.zip
                                                                                                                                                                                                                                                                                                            if-no-files-found: error
                                                                                                                                                                                                                                                                                                                      retention-days: 14
                                                                                                                                                                                                                                                                                                                      
                                                                                                                                                                                                                                                                                                                            - name: Upload build logs
                                                                                                                                                                                                                                                                                                                                    if: always()
                                                                                                                                                                                                                                                                                                                                            uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                                                                                                    with:
                                                                                                                                                                                                                                                                                                                                                              name: OrunHomework-build-logs
                                                                                                                                                                                                                                                                                                                                                                        path: build-logs/
                                                                                                                                                                                                                                                                                                                                                                                  if-no-files-found: warn
                                                                                                                                                                                                                                                                                                                                                                                            retention-days: 14
                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                        
                                                                    
